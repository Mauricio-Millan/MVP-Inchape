name: Deploy frontend

on:
  push:
    branches: [dev-inchape, main]
    paths: ["frontend/**", ".github/workflows/frontend-deploy.yml"]
  pull_request:
    branches: [dev-inchape, main]
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      # Build propio, no el de Oryx: Oryx detecta "Three.js" como framework
      # y con eso se salta npm install/npm run build por completo, sirviendo
      # el código TS sin compilar (index.html apuntando a /src/main.tsx).
      - working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mvp-inchape-api.azurewebsites.net

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
