const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);

const bx = DATA.contorno_edificio.map(p => p[0]);
const bz = DATA.contorno_edificio.map(p => p[1]);
const centerX = (Math.min(...bx) + Math.max(...bx)) / 2;
const centerZ = (Math.min(...bz) + Math.max(...bz)) / 2;
const spanX = Math.max(...bx) - Math.min(...bx);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 2000);
camera.position.set(centerX + spanX*0.7, spanX*0.8, centerZ + spanX*0.7);

const renderer = new THREE.WebGLRenderer({ antialias:true, logarithmicDepthBuffer:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(centerX, 0, centerZ);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, .7));
const dl = new THREE.DirectionalLight(0xffffff, .55);
dl.position.set(centerX+40, 60, centerZ+20); scene.add(dl);

const grid = new THREE.GridHelper(Math.ceil(spanX*1.4), 30, 0x2a2d36, 0x1c1e24);
grid.position.set(centerX, 0, centerZ); scene.add(grid);

// contorno del edificio
const ePts = DATA.contorno_edificio.map(p => new THREE.Vector3(p[0], .01, p[1]));
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ePts),
                          new THREE.LineBasicMaterial({ color:0x3a3d45 })));

// contornos y pisos de zona
DATA.boundaries.forEach(b => {
  const pts = b.puntos.map(p => new THREE.Vector3(p[0], .03, p[1]));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
                            new THREE.LineBasicMaterial({ color:0x5B6470 })));
  if (b.puntos.length >= 3) {
    const shape = new THREE.Shape(b.puntos.map(p => new THREE.Vector2(p[0], p[1])));
    const fm = new THREE.Mesh(new THREE.ShapeGeometry(shape),
      new THREE.MeshBasicMaterial({ color:0x1c2430, transparent:true, opacity:.35, side:THREE.DoubleSide }));
    fm.rotation.x = Math.PI/2; fm.position.y = -0.02;
    scene.add(fm);
  }
});

// --- cubos: se reconstruyen al cambiar de escenario ---
const boxGeo = new THREE.BoxGeometry(1,1,1);
const ALTURA = 0.8;
let meshes = [];
let escenarioActual = 'antes';

function pintarEscenario(nombre) {
  meshes.forEach(m => { scene.remove(m); m.material.dispose(); });
  meshes = [];
  DATA[nombre].forEach(d => {
    const mesh = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: d.color }));
    mesh.scale.set(d.w || .8, ALTURA, d.d || .8);
    mesh.position.set(d.x, ALTURA/2 + .01, d.z);
    mesh.userData = d;
    scene.add(mesh); meshes.push(mesh);
  });
  escenarioActual = nombre;
  actualizarKpis();
}

function actualizarKpis() {
  const pos = DATA[escenarioActual].filter(p => p.sku);
  const rojos = pos.filter(p => p.color === '#F09595').length;
  const verdes = pos.filter(p => p.color === '#97C459').length;
  const r = DATA.resumen;
  document.getElementById('kpis').innerHTML =
    `<div class="row"><span>SKU en alto impacto</span><span class="val">${rojos}</span></div>` +
    `<div class="row"><span>SKU en bajo impacto</span><span class="val">${verdes}</span></div>` +
    `<div class="row"><span>SKU que se mueven</span><span class="val">${r.skus_movidos}</span></div>` +
    `<div class="row"><span>Ahorro estimado</span><span class="val">${r.ahorro_min_anual.toLocaleString('es')} min/año</span></div>`;
}

document.getElementById('btn-antes').onclick = () => {
  pintarEscenario('antes');
  document.getElementById('btn-antes').classList.add('on');
  document.getElementById('btn-despues').classList.remove('on');
};
document.getElementById('btn-despues').onclick = () => {
  pintarEscenario('despues');
  document.getElementById('btn-despues').classList.add('on');
  document.getElementById('btn-antes').classList.remove('on');
};

pintarEscenario('antes');

// tooltip
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById('tooltip');
addEventListener('mousemove', e => {
  mouse.x = (e.clientX/innerWidth)*2 - 1;
  mouse.y = -(e.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(meshes);
  if (hits.length) {
    const d = hits[0].object.userData;
    tip.style.display = 'block';
    tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+14)+'px';
    tip.innerHTML = d.sku
      ? `<b>${d.sku}</b><br>${d.familia}<br>${d.zona} (${d.dist_m} m)<br>Líneas de pedido: ${d.n_lineas}` +
        (d.movimiento === 'MOVER' ? `<br><span style="color:#7fb3e8">Se reubica en la propuesta</span>` : '')
      : `<i>${d.zona}</i><br>Disponible`;
  } else tip.style.display = 'none';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function zoomPor(f) {
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).multiplyScalar(f);
  camera.position.copy(controls.target).add(dir); controls.update();
}
document.getElementById('zoom-in').onclick = () => zoomPor(.85);
document.getElementById('zoom-out').onclick = () => zoomPor(1.18);
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') zoomPor(.85);
  if (e.key === '-' || e.key === '_') zoomPor(1.18);
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
</script>
